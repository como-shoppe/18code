<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蝦皮折扣碼</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f7f7f8;
            margin: 0;
            padding: 20px 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background-color: #ffffff;
            border-radius: 12px;
            padding: 24px 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }

        h1 {
            color: #ee4d2d;
            font-size: 24px;
            text-align: center;
            margin: 0 0 6px 0;
        }

        .subtitle {
            color: #888888;
            font-size: 13px;
            text-align: center;
            margin-bottom: 24px;
        }

        .section-title {
            color: #d0011b;
            font-size: 15px;
            font-weight: bold;
            margin: 20px 0 10px 0;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .coupon-btn {
            width: 100%;
            background-color: #f04d2d;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px 10px;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 10px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 2px 4px rgba(240, 77, 45, 0.2);
        }

        .coupon-btn:active {
            background-color: #d83d1e;
            transform: scale(0.99);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>蝦皮折扣碼</h1>
    <div class="subtitle">點擊按鈕自動複製折扣碼並前往蝦皮</div>

    <!-- 全站折扣券 -->
    <div class="section-title">📍 全站折扣券</div>
    <button class="coupon-btn" onclick="copyAndGo('SHAFS18')">全站滿 $100 折 $20</button>

    <!-- 商城折扣券 -->
    <div class="section-title">📍 商城折扣券</div>
    <button class="coupon-btn" onclick="copyAndGo('FMAPP260918')">全家 商城滿 $299 折 $30</button>

    <!-- 社群賣家滿 $999 折 $100 -->
    <div class="section-title">📍 社群賣家滿 $999 折 $100</div>
    <button class="coupon-btn" onclick="copyAndGo('ZTAFF100')">社群賣家滿 $999 折 $100 第一組</button>
    <button class="coupon-btn" onclick="copyAndGo('0918MTOB2')">社群賣家滿 $999 折 $100 第二組</button>
    <button class="coupon-btn" onclick="copyAndGo('0918NDD2')">社群賣家滿 $999 折 $100 第三組</button>

    <!-- 社群賣家滿 $499 折 $40 -->
    <div class="section-title">📍 社群賣家滿 $499 折 $40</div>
    <button class="coupon-btn" onclick="copyAndGo('ZTAFF40')">社群賣家滿 $499 折 $40 第一組</button>
    <button class="coupon-btn" onclick="copyAndGo('0918MTOB1')">社群賣家滿 $499 折 $40 第二組</button>
    <button class="coupon-btn" onclick="copyAndGo('0918NDD1')">社群賣家滿 $499 折 $40 第三組</button>
</div>

<script>
    // 更新後的蝦皮跳轉頁面連結
    const targetUrl = "https://s.shopee.tw/70KCmEFxVr";

    function copyAndGo(code) {
        // 使用剪貼簿 API 複製折扣碼
        navigator.clipboard.writeText(code).then(() => {
            alert("已複製折扣碼！\n即將前往蝦皮頁面！");
            window.location.href = targetUrl;
        }).catch(err => {
            // 備用複製方案（防舊版瀏覽器不支援 API）
            const textInput = document.createElement("input");
            textInput.value = code;
            document.body.appendChild(textInput);
            textInput.select();
            document.execCommand("copy");
            document.body.removeChild(textInput);
            alert("已複製折扣碼！\n即將前往蝦皮頁面！");
            window.location.href = targetUrl;
        });
    }
</script>

</body>
</html>
